name: Tourism ML Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: turisum/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r turisum/requirements.txt

      - name: Show production environment
        run: |
          python - <<'PY'
          import sys, sklearn, joblib, numpy, pandas
          print("Python:", sys.version.split()[0])
          print("scikit-learn:", sklearn.__version__)
          print("joblib:", joblib.__version__)
          print("numpy:", numpy.__version__)
          print("pandas:", pandas.__version__)
          PY

      - name: Run end-to-end ML pipeline
        run: python turisum/ci_pipeline.py

      - name: Validate Streamlit app
        run: python -m py_compile turisum/deployment/app.py

      - name: Validate production artifacts
        run: |
          python - <<'PY'
          import json, joblib, sklearn
          from pathlib import Path

          root = Path("turisum")
          model = joblib.load(root / "model_building" / "best_model.joblib")
          metadata = json.loads(
              (root / "model_building" / "metadata.json").read_text()
          )

          assert hasattr(model, "predict_proba")
          assert 0 < float(metadata["decision_threshold"]) < 1
          assert metadata["environment"]["scikit_learn"] == sklearn.__version__
          print("Production artifacts validated.")
          PY

      - name: Commit refreshed ML artifacts to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            turisum/data/train.csv \
            turisum/data/test.csv \
            turisum/model_building/best_model.joblib \
            turisum/model_building/metadata.json \
            turisum/reports/model_comparison.csv

          git diff --cached --quiet || \
            git commit -m "Update ML artifacts [skip ci]"

          git push
